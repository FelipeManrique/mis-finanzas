<!-- Marca de Mis Finanzas: una moneda cuyo interior es una onda de voz. © 2026 Felipe Manrique. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="0.55" stop-color="#1468F0"/>
      <stop offset="1" stop-color="#3B2FC9"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0FA968"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- sombra suave de la moneda -->
  <circle cx="512" cy="540" r="300" fill="#0B2A8C" opacity="0.28"/>
  <!-- moneda -->
  <circle cx="512" cy="512" r="300" fill="url(#coin)"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#1468F0" stroke-opacity="0.14" stroke-width="16"/>
  <!-- onda de voz: barras que suben como un gráfico -->
  <g fill="url(#wave)">
    <rect x="324" y="452" width="56" height="120" rx="28"/>
    <rect x="404" y="387" width="56" height="250" rx="28"/>
    <rect x="484" y="322" width="56" height="380" rx="28"/>
    <rect x="564" y="382" width="56" height="260" rx="28"/>
    <rect x="644" y="442" width="56" height="140" rx="28"/>
  </g>
</svg>
