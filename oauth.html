<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Mis Finanzas · Google</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #F2F2F7; --card: #fff; --label: #000; --label-2: rgba(60,60,67,.64); --accent: #007AFF; --ok: #248A3D; --bad: #D70015; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --label: #fff; --label-2: rgba(235,235,245,.62); --accent: #0A84FF; --ok: #30D158; --bad: #FF453A; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-inline: 16px; }
  main { background: var(--card); border-radius: 20px; padding: 28px 24px; max-width: 380px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .mark { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--accent); }
  .mark.ok { background: var(--ok); } .mark.bad { background: var(--bad); }
  .mark svg { width: 28px; height: 28px; }
  h1 { font-size: 22px; line-height: 28px; margin: 4px 0 0; }
  p { margin: 0; color: var(--label-2); font-size: 15px; }
  a { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="mark" id="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v6l4 2"/></svg></div>
  <h1 id="title">Conectando…</h1>
  <p id="msg">Un segundo.</p>
  <a href="javascript:history.length>1?history.back():location.assign('./')" id="back" hidden>Volver a la app</a>
</main>
<script>
(async function () {
  const BROKER_URL = 'https://script.google.com/macros/s/AKfycbzqMyt30WtQnaUyPxk6SOzmhvmL7Dzp_A6Y1QLTYwAUdyH89j1SoiD54lMbqLWtX_Sv/exec';
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), session = q.get('state'), error = q.get('error');
  history.replaceState(null, '', location.pathname); // que el código no quede en el historial
  const show = (ok, title, msg) => {
    document.getElementById('mark').className = 'mark ' + (ok ? 'ok' : 'bad');
    document.getElementById('mark').innerHTML = ok
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>';
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg;
    document.getElementById('back').hidden = false;
  };
  if (error || !code || !session) {
    show(false, 'No se conectó', error === 'access_denied' ? 'Cancelaste el permiso. Podés volver a intentarlo desde Ajustes.' : 'Faltan datos de Google. Volvé a intentarlo desde Ajustes.');
    return;
  }
  try {
    const res = await fetch(BROKER_URL, { method: 'POST', body: JSON.stringify({ action: 'exchange', code, session }) });
    const r = JSON.parse(await res.text());
    if (!r.ok) throw new Error(r.error);
    show(true, 'Listo', 'Tu cuenta de Google quedó conectada. Volvé a la app para terminar.');
  } catch (e) {
    show(false, 'No se conectó', 'Google no aceptó el inicio de sesión. Volvé a intentarlo desde Ajustes.');
  }
})();
</script>
</body>
</html>
