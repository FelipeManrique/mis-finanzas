<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de voz (simulada)</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<!-- Simula webkitSpeechRecognition para probar el flujo de voz sin micrófono.
     window.__say = ['frase parcial', 'frase final'] define lo que "escucha". -->
<script>
window.__say = ['gasté 12 mil', 'gasté 12 mil en nafta con débito y 3500 en un café'];
window.__sayError = null;
class FakeSR {
  start() {
    setTimeout(() => this.onstart && this.onstart(), 50);
    if (window.__sayError) { setTimeout(() => { this.onerror({ error: window.__sayError }); this.onend(); }, 150); return; }
    window.__say.forEach((t, i) => setTimeout(() => {
      const last = i === window.__say.length - 1;
      const r = [{ transcript: t }]; r.isFinal = last;
      this.onresult({ results: [r] });
    }, 200 + i * 200));
  }
  stop() { setTimeout(() => this.onend && this.onend(), 30); }
  abort() { this.stop(); }
}
window.webkitSpeechRecognition = window.SpeechRecognition = FakeSR;
</script>
<main class="app" id="app">
  <section id="view-movs" data-view="movs">
    <header class="topbar">
      <h1 class="large-title">Movimientos</h1>
      <button class="icon-btn" id="btn-add" aria-label="Cargar a mano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <div class="month-switch" data-month-switch></div>
    <div class="summary" id="summary"></div>
    <div id="backup-banner"></div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <span class="sr">Buscar</span><input id="q" type="search" placeholder="Buscar" autocomplete="off"></label>
      <div class="segmented" id="type-filter" role="group" aria-label="Tipo">
        <button data-f="all" aria-pressed="true">Todos</button><button data-f="gasto" aria-pressed="false">Gastos</button><button data-f="ingreso" aria-pressed="false">Ingresos</button>
      </div>
      <div class="chip-filter" id="cat-filter" hidden></div>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-stats" data-view="stats" hidden>
    <header class="topbar"><h1 class="large-title">Análisis</h1></header>
    <div class="month-switch" data-month-switch></div>
    <div id="stats"></div>
  </section>

  <section id="view-accounts" data-view="accounts" hidden>
    <header class="topbar"><h1 class="large-title">Cuentas</h1></header>
    <div id="accounts"></div>
  </section>

  <section id="view-settings" data-view="settings" hidden>
    <header class="topbar"><h1 class="large-title">Ajustes</h1></header>
    <div id="settings"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Secciones">
  <button class="tab" data-tab="movs" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>Movimientos</button>
  <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Análisis</button>
  <button class="mic" id="btn-mic" aria-label="Cargar con la voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
  <button class="tab" data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Cuentas</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 7l2.6 1.5M17.2 15.5l2.6 1.5M4.2 17l2.6-1.5M17.2 8.5 19.8 7"/></svg>Ajustes</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <div class="sheet-head">
    <button class="txt-btn" id="sheet-left">Cancelar</button>
    <h2 id="sheet-title"></h2>
    <button class="txt-btn strong" id="sheet-right"></button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-btn" hidden>Deshacer</button></div>
<input type="file" id="import-file" accept="application/json,.json,text/csv,.csv" hidden>
<script src="../parser.js"></script>
<script src="../app.js"></script>
</body></html>
